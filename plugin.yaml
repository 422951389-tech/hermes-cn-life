name: cn-life
version: 0.1.0
description: "中国生活服务工具集：12306火车票查询、高德地图(POI/路线/天气)、余票监控推送。查询类免费无key(12306)；高德需免费key。所有交易类功能永不自动支付。"
author: zhushou
license: MIT
homepage: https://github.com/placeholder/cn-life
tags: [china, travel, life, gateway]
manifest_version: 2
api_version: 1
provides_tools:
  - cn_train_query
  - cn_train_station
  - cn_amap_poi
  - cn_amap_route
  - cn_amap_weather
requires_env:
  - name: AMAP_KEY
    description: "高德开放平台免费key (https://console.amap.com) — 不填则高德三工具禁用, 12306不受影响"
    secret: false
config_schema:
  amap_key:
    {type: str, default: "", description: "高德key(也可用环境变量AMAP_KEY)"}
